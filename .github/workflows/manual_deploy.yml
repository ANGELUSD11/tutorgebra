name: Manual Deploy to Railway

on:
  workflow_dispatch: # Allows the workflow to be triggered manually from the GitHub Actions tab

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Verify Python Scripts Integrity
        run: |
          echo "Compiling Python files to check for syntax errors..."
          python -m py_compile app/*.py
          echo "All Python scripts passed syntax validation! ✅"

  deploy:
    needs: validate-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Railway CLI
        run: npm i -g @railway/cli
        
      - name: Deploy via Railway CLI
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
